name: EasyTier Core Release

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: 'Optional Core run id. Leave empty to use the latest successful EasyTier Core run'
        type: string
        required: false
        default: ''
      branch:
        description: 'Branch to look up Core run on when core_run_id is empty (default: current branch)'
        type: string
        required: false
        default: ''
      version:
        description: 'Version / tag for this release (e.g. v2.7.0-custom)'
        type: string
        default: 'v2.7.0'
        required: true
      make_latest:
        description: 'Mark this release as latest'
        type: boolean
        default: false
        required: true
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Core run id
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.core_run_id }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if [ -n "$INPUT_RUN_ID" ]; then
            echo "Using provided core_run_id=$INPUT_RUN_ID"
            echo "run_id=$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="$INPUT_BRANCH"
          if [ -z "$BRANCH" ]; then
            BRANCH="${{ github.ref_name }}"
          fi

          RUN_ID=$(gh run list \
            --workflow "EasyTier Core" \
            --branch "$BRANCH" \
            --status completed \
            --json databaseId,conclusion,url,displayTitle,headBranch \
            --limit 20 \
            --jq '[.[] | select(.conclusion == "success")] | .[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No successful EasyTier Core run found on branch '$BRANCH'"
            echo "Push/run EasyTier Core first, or pass core_run_id explicitly."
            exit 1
          fi

          echo "Auto-resolved Core run_id=$RUN_ID (branch=$BRANCH)"
          gh run view "$RUN_ID" --json url,displayTitle,headSha,event,createdAt \
            --jq '"title=\(.displayTitle)\nurl=\(.url)\nsha=\(.headSha)\nevent=\(.event)\ncreated=\(.createdAt)"'
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Core artifacts
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.resolve.outputs.run_id }}
          repo: ${{ github.repository }}
          # Keep official Core packages (incl. web-dashboard); skip SignPath test uploads
          name: '^(easytier-|Easytier-Magisk)'
          name_is_regexp: true
          path: release_assets

      - name: Zip Core release assets
        env:
          VERSION: ${{ inputs.version }}
          CORE_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          mkdir -p zipped_assets

          if [ ! -d release_assets ] || [ -z "$(ls -A release_assets)" ]; then
            echo "No Core artifacts found for run_id=$CORE_RUN_ID"
            exit 1
          fi

          cd release_assets
          ls -l -R ./
          chmod -R 755 .
          for x in `ls`; do
            if [ "$x" = "Easytier-Magisk" ]; then
              cd "$x"
              zip -r ../../zipped_assets/$x-${VERSION}.zip .
              cd ..
            else
              zip -r ../zipped_assets/$x-${VERSION}.zip "$x"
            fi
          done
          cd ..

          ls -l -R ./zipped_assets
          if [ -z "$(ls -A zipped_assets)" ]; then
            echo "No zip files produced"
            exit 1
          fi

      - name: Publish Core Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          make_latest: ${{ inputs.make_latest }}
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Core-only release from EasyTier Core run `${{ steps.resolve.outputs.run_id }}`.
